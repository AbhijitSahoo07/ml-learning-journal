name: Daily ML Learning Note Generator

on:
  schedule:
    # Runs at 00:00 UTC every day (approx. 5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force generation even if notes were already generated today'
        required: false
        type: boolean
        default: false
      model:
        description: 'Gemini model to use'
        required: false
        type: string
        default: 'gemini-2.0-flash'
      count:
        description: 'Number of notes to generate (1-10). Leave empty for random (1-10).'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history to ensure proper versioning and avoid push conflicts
          fetch-depth: 0

      - name: Sync to Latest Remote State (Prevents Re-run Conflicts)
        run: |
          git config --local user.email "187935020+AbhijitSahoo07@users.noreply.github.com"
          git config --local user.name "AbhijitSahoo07"
          git checkout main || git checkout master || true
          git pull origin main || git pull origin master || echo "No remote changes to sync"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate, Commit, and Push Notes (Random 1 to 10)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-2.0-flash' }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --local user.email "187935020+AbhijitSahoo07@users.noreply.github.com"
          git config --local user.name "AbhijitSahoo07"

          # Determine target number of notes: manual input or random between 1 and 10
          if [ -n "$INPUT_COUNT" ] && [ "$INPUT_COUNT" -ge 1 ] 2>/dev/null; then
            TARGET_COUNT=$INPUT_COUNT
            echo "Target note count set from manual input: $TARGET_COUNT"
          else
            # Pick a random number between 1 and 10 (inclusive)
            TARGET_COUNT=$(( RANDOM % 10 + 1 ))
            echo "Randomly chosen note count for today: $TARGET_COUNT"
          fi

          BRANCH="main"
          git show-ref --quiet refs/heads/master && BRANCH="master"

          for i in $(seq 1 $TARGET_COUNT); do
            echo "=================================================="
            echo "Generating Note $i of $TARGET_COUNT..."
            echo "=================================================="

            if [ $i -gt 1 ]; then
              echo "Waiting 10 seconds before next request..."
              sleep 10
            fi

            # Call generate_note.py with --force and --max-per-day 10
            python generate_note.py --force --max-per-day 10

            git add notes/

            if git diff --cached --quiet; then
              echo "No new changes detected for Note $i. Ending generation early."
              break
            else
              git commit -m "docs: Auto-generate daily learning note (Part $i of $TARGET_COUNT)"
              
              # Pull changes with rebase, aborting if conflicts occur and using merge ours strategy as fallback
              if ! git pull --rebase origin $BRANCH; then
                git rebase --abort 2>/dev/null || true
                git pull --no-rebase -X ours origin $BRANCH
              fi
              git push origin HEAD
              echo "Successfully pushed Note $i of $TARGET_COUNT."
            fi
          done
